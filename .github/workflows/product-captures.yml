name: Product captures

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the plan without building, capturing, or publishing.
        type: boolean
        default: true
      reuse_screenshots:
        description: Restyle the saved screenshots instead of opening the product.
        type: boolean
        default: false
      url:
        description: Optional running web preview; skips the build and managed server.
        type: string
        default: ""
      update_pr:
        description: Open a review-only PR with the generated images.
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  captures:
    uses: grafanaKibana/product-captures/.github/workflows/capture.yml@v2
    with:
      dry-run: ${{ inputs.dry_run }}
      reuse-screenshots: ${{ inputs.reuse_screenshots }}
      url: ${{ inputs.url }}
      update-pr: ${{ inputs.update_pr }}
