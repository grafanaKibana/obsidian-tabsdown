name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - run: npm ci
      - run: npm run check

      - name: Check the demo vault runs this commit
        shell: bash
        run: |
          set -euo pipefail
          npm run demo

          if ! git diff --quiet -- demo/.obsidian/plugins/tabsdown; then
            echo "::error::The demo vault plugin is stale. Run 'npm run demo' and commit the result."
            git diff --stat -- demo/.obsidian/plugins/tabsdown
            exit 1
          fi

      - name: Store release-shaped build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabsdown-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7
