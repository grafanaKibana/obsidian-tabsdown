name: Verify product capture tool

on:
  pull_request:
    paths:
      - ".github/workflows/product-captures*.yml"
      - "product-captures.json"
      - "docs/capture-fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/product-captures*.yml"
      - "product-captures.json"
      - "docs/capture-fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: grafanaKibana/product-captures/.github/workflows/validate.yml@v1
    with:
      config: product-captures.json
