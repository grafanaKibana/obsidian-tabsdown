name: Product captures
description: Capture real products with Playwright and render reusable README artwork.
inputs:
  config:
    description: Path to the repository-owned scene configuration.
    default: product-captures.json
  dry-run:
    description: Validate and print the plan without installing, building, capturing, or publishing.
    default: 'true'
  capture-mode:
    description: fresh captures the current product; existing explicitly reuses configured image inputs.
    default: fresh
  only:
    description: Comma-separated output IDs; empty renders every output.
    default: ''
  template:
    description: Optional editorial, feature, or showcase template override.
    default: ''
  theme:
    description: Optional light or dark override.
    default: ''
  width:
    description: Optional output width override.
    default: ''
  height:
    description: Optional output height override.
    default: ''
  scale:
    description: Optional device scale factor from 1 to 3.
    default: ''
  base-url:
    description: Optional web origin override for preview/manual captures.
    default: ''
  output-dir:
    description: Optional output directory relative to the config, inside the checkout.
    default: ''
  skip-prepare:
    description: Reuse a product already built by an earlier release step.
    default: 'false'
  release-tag:
    description: Explicit existing release to receive generated PNG assets; empty disables release uploads.
    default: ''
  update-pr:
    description: Open a review-only PR updating finished PNGs; requires contents and pull-requests write.
    default: 'false'
  token:
    description: GitHub token used only for release uploads and optional image PR publication.
    default: ${{ github.token }}
outputs:
  artifact-path:
    description: Repository-relative generated output directory.
    value: ${{ steps.plan.outputs.artifact-path }}
runs:
  using: composite
  steps:
    - name: Validate and plan captures
      id: plan
      shell: bash
      env:
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_MODE: ${{ inputs.capture-mode }}
        CAPTURE_ONLY: ${{ inputs.only }}
        CAPTURE_TEMPLATE: ${{ inputs.template }}
        CAPTURE_THEME: ${{ inputs.theme }}
        CAPTURE_WIDTH: ${{ inputs.width }}
        CAPTURE_HEIGHT: ${{ inputs.height }}
        CAPTURE_SCALE: ${{ inputs.scale }}
        CAPTURE_BASE_URL: ${{ inputs.base-url }}
        CAPTURE_OUTPUT_DIR: ${{ inputs.output-dir }}
        CAPTURE_SKIP_PREPARE: ${{ inputs.skip-prepare }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
      run: node "$GITHUB_ACTION_PATH/workflow.mjs" plan

    - name: Install isolated capture dependencies
      if: steps.plan.outputs.dry-run == 'false'
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: Install the capture browser
      if: steps.plan.outputs.dry-run == 'false'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/node_modules/playwright/cli.js" install --with-deps chromium

    - name: Install the virtual Obsidian display
      if: steps.plan.outputs.dry-run == 'false' && steps.plan.outputs.needs-obsidian == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes xvfb openbox

    - name: Capture and compose PNG artwork
      if: steps.plan.outputs.dry-run == 'false'
      shell: bash
      env:
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_MODE: ${{ inputs.capture-mode }}
        CAPTURE_ONLY: ${{ inputs.only }}
        CAPTURE_TEMPLATE: ${{ inputs.template }}
        CAPTURE_THEME: ${{ inputs.theme }}
        CAPTURE_WIDTH: ${{ inputs.width }}
        CAPTURE_HEIGHT: ${{ inputs.height }}
        CAPTURE_SCALE: ${{ inputs.scale }}
        CAPTURE_BASE_URL: ${{ inputs.base-url }}
        CAPTURE_OUTPUT_DIR: ${{ inputs.output-dir }}
        CAPTURE_SKIP_PREPARE: ${{ inputs.skip-prepare }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
      run: node "$GITHUB_ACTION_PATH/workflow.mjs" run

    - name: Upload capture previews
      if: steps.plan.outputs.dry-run == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: product-captures-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.plan.outputs.artifact-path }}
        if-no-files-found: error

    - name: Attach artwork to the selected release
      if: steps.plan.outputs.dry-run == 'false' && inputs.release-tag != ''
      shell: bash
      env:
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_MODE: ${{ inputs.capture-mode }}
        CAPTURE_ONLY: ${{ inputs.only }}
        CAPTURE_TEMPLATE: ${{ inputs.template }}
        CAPTURE_THEME: ${{ inputs.theme }}
        CAPTURE_WIDTH: ${{ inputs.width }}
        CAPTURE_HEIGHT: ${{ inputs.height }}
        CAPTURE_SCALE: ${{ inputs.scale }}
        CAPTURE_BASE_URL: ${{ inputs.base-url }}
        CAPTURE_OUTPUT_DIR: ${{ inputs.output-dir }}
        CAPTURE_SKIP_PREPARE: ${{ inputs.skip-prepare }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
        GH_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/workflow.mjs" release

    - name: Open an image update pull request
      if: steps.plan.outputs.dry-run == 'false' && inputs.update-pr == 'true'
      shell: bash
      env:
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_MODE: ${{ inputs.capture-mode }}
        CAPTURE_ONLY: ${{ inputs.only }}
        CAPTURE_TEMPLATE: ${{ inputs.template }}
        CAPTURE_THEME: ${{ inputs.theme }}
        CAPTURE_WIDTH: ${{ inputs.width }}
        CAPTURE_HEIGHT: ${{ inputs.height }}
        CAPTURE_SCALE: ${{ inputs.scale }}
        CAPTURE_BASE_URL: ${{ inputs.base-url }}
        CAPTURE_OUTPUT_DIR: ${{ inputs.output-dir }}
        CAPTURE_SKIP_PREPARE: ${{ inputs.skip-prepare }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
        GH_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/workflow.mjs" pr
